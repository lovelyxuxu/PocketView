<!doctype html><html><meta charset="utf-8"><title>PocketView fullscreen fixture</title><style>body{margin:0;background:#182138;color:#fff;font:20px sans-serif}#player{width:70vw;height:65vh;background:#171e30;display:grid;place-items:center}#player:fullscreen{width:100%;height:100%;background:#171e30}video{width:100%;height:100%;object-fit:contain}canvas{display:none}</style><div id="player"><video id="video" autoplay muted playsinline></video></div><canvas id="canvas" width="1280" height="720"></canvas><script>const c=document.getElementById('canvas'),x=c.getContext('2d');function draw(){x.fillStyle='#182138';x.fillRect(0,0,1280,720);x.fillStyle='#8d80f5';x.fillRect(60,60,1160,600);x.fillStyle='#fff';x.textAlign='center';x.font='48px sans-serif';x.fillText('PocketView / WINDOW FULLSCREEN',640,340);x.font='27px sans-serif';x.fillText('Video fills the window. Your desktop stays yours.',640,400);requestAnimationFrame(draw)}draw();document.getElementById('video').srcObject=c.captureStream(15);</script></html>
